name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Python
        run: python3 -m compileall -q packages services

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.14

      - name: Render Kubernetes overlays
        run: |
          set -euo pipefail
          for environment in dev qa production; do
            kubectl kustomize "infra/k8s/overlays/${environment}" > "/tmp/${environment}.yaml"
            test -s "/tmp/${environment}.yaml"
          done

      - name: Verify repository references
        run: |
          set -euo pipefail
          if grep -R "cloudops-microservices-platform" infra/argocd README.md docs; then
            echo "Old repository reference found"
            exit 1
          fi

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - web
          - auth
          - catalog
          - search
          - inventory
          - recommendations
          - cart
          - orders
          - learning
          - labs
          - community
          - certificates
          - leaderboard
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build image
        run: |
          set -euo pipefail
          docker build \
            -t cloudops/${{ matrix.service }}:ci \
            -f services/${{ matrix.service }}/Dockerfile .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloudops/${{ matrix.service }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
