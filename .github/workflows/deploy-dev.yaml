name: Deploy Dev Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOCKERHUB_NAMESPACE: jaganmr49

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.actor.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - web
          - auth
          - catalog
          - search
          - inventory
          - recommendations
          - cart
          - orders
          - learning
          - labs
          - community
          - certificates
          - leaderboard
    steps:
      - name: Resolve published image tag
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="${GITHUB_SHA}"
          fi
          echo "tag=${sha::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Confirm the CI image exists
        run: |
          set -euo pipefail
          image="docker.io/${DOCKERHUB_NAMESPACE}/cloudops-${{ matrix.service }}:${{ steps.revision.outputs.tag }}"
          docker buildx imagetools inspect "${image}"

  update-dev-gitops:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve published image tag
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="${GITHUB_SHA}"
          fi
          echo "tag=${sha::12}" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Dev overlay
        run: ./scripts/set-overlay-images.sh dev "docker.io/${DOCKERHUB_NAMESPACE}" "${{ steps.revision.outputs.tag }}"

      - name: Commit GitOps change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/overlays/dev/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Dev overlay already references this image tag"
            exit 0
          fi
          git commit -m "chore(dev): deploy images ${{ steps.revision.outputs.tag }}"
          git push origin HEAD:main
