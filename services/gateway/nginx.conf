server {
    listen 80;
    server_name _;

    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/signup { proxy_pass http://auth:8080; }
    location /api/login { proxy_pass http://auth:8080; }
    location /api/books { proxy_pass http://catalog:8080; }
    location /api/cart { proxy_pass http://cart:8080; }
    location /api/buy { proxy_pass http://orders:8080; }
    location /api/orders { proxy_pass http://orders:8080; }
    location /api/exam { proxy_pass http://learning:8080; }
    location /api/exams { proxy_pass http://learning:8080; }
    location /api/labs { proxy_pass http://labs:8080; }
    location /api/community { proxy_pass http://community:8080; }
    location /api/certificates { proxy_pass http://certificates:8080; }
    location /api/leaderboard { proxy_pass http://leaderboard:8080; }
    location /api/health { default_type application/json; return 200 '{"ok":true,"service":"gateway"}'; }

    location / {
        proxy_pass http://web:80;
    }
}
