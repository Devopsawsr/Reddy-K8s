apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudops-root
  namespace: argocd
spec:
  project: cloudops
  source:
    repoURL: https://github.com/Devopsawsr/Reddy-K8s.git
    targetRevision: main
    path: infra/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Bootstrap changes are reviewed and synchronized manually. Child
  # applications define their own environment-specific sync policies.
