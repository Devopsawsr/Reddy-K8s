apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudops-dev
  namespace: argocd
spec:
  project: cloudops
  source:
    repoURL: https://github.com/Devopsawsr/Reddy-K8s.git
    targetRevision: main
    path: infra/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudops-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
