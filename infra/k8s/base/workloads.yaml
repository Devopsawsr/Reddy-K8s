apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaderboard
  labels:
    app.kubernetes.io/name: leaderboard
    app.kubernetes.io/part-of: cloudops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leaderboard
  template:
    metadata:
      labels:
        app: leaderboard
        app.kubernetes.io/name: leaderboard
        app.kubernetes.io/part-of: cloudops
    spec:
      serviceAccountName: cloudops
      containers:
        - name: leaderboard
          image: cloudops/leaderboard:0.1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: cloudops-config
            - secretRef:
                name: cloudops-db
                optional: true
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
          env:
            - name: DATA_DIR
              value: "/data"
            - name: LEARNING_URL
              value: "http://learning:8080"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: leaderboard
  labels:
    app.kubernetes.io/name: leaderboard
    app.kubernetes.io/part-of: cloudops
spec:
  selector:
    app: leaderboard
  ports:
    - port: 8080
      targetPort: 8080
