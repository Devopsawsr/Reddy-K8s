apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  labels:
    app.kubernetes.io/name: search
    app.kubernetes.io/part-of: cloudops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
        app.kubernetes.io/name: search
        app.kubernetes.io/part-of: cloudops
    spec:
      serviceAccountName: cloudops
      containers:
        - name: search
          image: cloudops/search:0.1
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 96Mi
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: search
  labels:
    app.kubernetes.io/name: search
    app.kubernetes.io/part-of: cloudops
spec:
  selector:
    app: search
  ports:
    - name: http
      port: 8080
      targetPort: http
---
