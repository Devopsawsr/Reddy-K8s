# Create this Secret at deployment time. Do not commit the real URL.
# kubectl -n cloudops-dev create secret generic cloudops-db \
#   --from-literal=DATABASE_URL='postgresql://cloudops_user:PASS@postgresql:5432/cloudops'
apiVersion: v1
kind: Secret
metadata:
  name: cloudops-db
type: Opaque
stringData:
  DATABASE_URL: postgresql://cloudops_user:REPLACE@postgresql:5432/cloudops
