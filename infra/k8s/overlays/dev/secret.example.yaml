# Copy to Secret after you create RDS. Do not commit the real URL.
# kubectl -n cloudops-dev create secret generic cloudops-db \
#   --from-literal=DATABASE_URL='postgresql://USER:PASS@HOST:5432/cloudops'
apiVersion: v1
kind: Secret
metadata:
  name: cloudops-db
type: Opaque
stringData:
  DATABASE_URL: postgresql://REPLACE:REPLACE@REPLACE:5432/cloudops
